name: Update YouTube Stats

on:
  schedule:
    # 毎日UTC時間の0:00と12:00（日本時間の9:00と21:00）に自動実行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 手動実行用ボタンも有効化

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin googleapis dotenv

      - name: Run update script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_CHANNEL_ID: 'UC20ns0anAsbj_UFlhVnfu3A' # 実際のチャンネルIDを入れてください
        run: node scripts/update-youtube-stats.js
